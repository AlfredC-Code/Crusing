<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bdeeff">
  <meta name="description" content="A fun live countdown to our November 6, 2026 cruise.">
  <title>Cruise Countdown — November 6, 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Shrikhand&display=swap');
    :root{--navy:#12375f;--blue:#0d79b8;--coral:#ff725e;--sand:#fff4dc}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overflow-x:hidden}
    body{font-family:"DM Sans",Arial,sans-serif;color:var(--navy);background:#bdeeff}
    button{font:inherit}
    .page{min-height:100svh;overflow:hidden;position:relative;background:linear-gradient(180deg,#bdeeff 0%,#e8faff 59%,#fef7e5 59%);display:flex;flex-direction:column}
    .hero{width:min(920px,calc(100% - 32px));margin:0 auto;padding:52px 0 12px;text-align:center;position:relative;z-index:4}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 14px;padding:9px 17px;border-radius:999px;background:#ffffffa8;border:1px solid #fff;font-size:.75rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;box-shadow:0 8px 30px #29769a18}
    h1{margin:0;font-family:"Shrikhand",Georgia,serif;font-weight:400;font-size:clamp(3.2rem,9vw,6.8rem);line-height:.87;letter-spacing:-.03em;text-shadow:0 4px 0 #fff8}
    h1 em{color:var(--coral);font-style:normal}
    .date{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0 25px;font-size:clamp(.78rem,2vw,1rem);font-weight:800;letter-spacing:.18em}
    .date span{color:var(--coral)}
    .countdown{width:min(700px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .time-card{min-width:0;padding:16px 8px 14px;background:#fff;border:2px solid #fff;border-radius:20px;box-shadow:0 12px 30px #23557818,inset 0 -4px 0 #e3f5fa}
    .time-card strong{display:block;font-size:clamp(2rem,6vw,3.6rem);line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue)}
    .time-card span{display:block;margin-top:8px;font-size:clamp(.6rem,1.6vw,.75rem);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#617b91}
    .tip{width:min(600px,100%);min-height:72px;margin:18px auto 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:12px 14px;text-align:left;background:#ffffff78;border:1px solid #fff;border-radius:20px}
    .tip-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffd972;color:#a65a22;font-size:1.35rem}
    .tip-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--coral)}
    .tip p{margin:2px 0 0;font-size:.86rem;color:#345878}
    .tip button{width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;color:var(--blue);background:#fff;font-size:1.25rem;transition:transform .2s,background .2s}
    .tip button:hover{transform:rotate(45deg);background:#e8f9ff}
    .tip button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
    .sun{position:absolute;top:64px;right:8%;width:95px;height:95px;border-radius:50%;background:#ffdf70;box-shadow:0 0 0 18px #ffdf7026}
    .cloud{position:absolute;z-index:1;width:120px;height:31px;border-radius:30px;background:#fff9;filter:drop-shadow(0 6px 12px #4b91ac15);animation:drift 9s ease-in-out infinite alternate}
    .cloud::before,.cloud::after{content:"";position:absolute;bottom:0;border-radius:50%;background:inherit}
    .cloud::before{left:21px;width:50px;height:50px}.cloud::after{right:18px;width:38px;height:38px}
    .cloud-one{top:150px;left:5%}.cloud-two{top:300px;right:5%;transform:scale(.7);animation-delay:-3s}
    .ocean{position:relative;z-index:3;height:235px;margin-top:auto;overflow:hidden;background:linear-gradient(180deg,#20b9cf 0 18%,#087eb4 18% 58%,#06689c 58%)}
    .wave{position:absolute;left:-5%;width:110%;height:38px;background-size:60px 38px;opacity:.95}
    .wave-a{top:-5px;background:radial-gradient(30px 18px at 30px 22px,transparent 18px,#fff 19px 22px,transparent 23px);animation:waves 5s linear infinite}
    .wave-b{top:92px;opacity:.18;background:radial-gradient(28px 15px at 28px 18px,transparent 15px,#fff 16px 19px,transparent 20px);animation:waves 7s linear infinite reverse}
    .ship-wrap{position:absolute;z-index:4;left:50%;bottom:36px;width:275px;height:145px;transform:translateX(-58%);animation:bob 3.2s ease-in-out infinite}
    .ship{position:absolute;bottom:0;width:100%;height:120px;filter:drop-shadow(0 13px 10px #034c7055)}
    .hull{position:absolute;left:18px;bottom:0;width:240px;height:52px;background:#fff;border-radius:4px 8px 75px 48px;border-bottom:13px solid var(--coral);transform:skewX(-8deg)}
    .hull span{display:block;margin:10px 0 0 75px;font-weight:800;font-size:.64rem;letter-spacing:.16em;color:var(--blue);transform:skewX(8deg)}
    .deck{position:absolute;left:61px;bottom:47px;width:159px;height:38px;padding:12px 17px;display:flex;gap:10px;background:#fff;border-radius:7px 15px 2px 2px}
    .deck i,.top i{display:block;width:14px;height:11px;background:#74d9ed;border-radius:3px;border:2px solid #2579a3}
    .top{position:absolute;left:92px;bottom:82px;width:105px;height:25px;padding:7px 12px;display:flex;gap:8px;background:#fff;border-radius:6px 10px 0 0}
    .top i{width:10px;height:8px;border-width:1px}.top::before{content:"";position:absolute;width:20px;height:26px;left:42px;bottom:22px;background:var(--coral);border:5px solid #fff;border-bottom:0;border-radius:3px 3px 0 0}
    .flag{position:absolute;z-index:5;left:143px;bottom:116px;width:2px;height:24px;background:var(--navy)}
    .flag::after{content:"";position:absolute;left:2px;width:22px;height:13px;background:#ffcf55;clip-path:polygon(0 0,100% 50%,0 100%)}
    .smoke{position:absolute;z-index:2;border-radius:50%;background:#fff9;animation:puff 2.4s ease-out infinite}.smoke-one{left:132px;top:0;width:18px;height:18px}.smoke-two{left:143px;top:-14px;width:12px;height:12px;animation-delay:.7s}
    .island{position:absolute;right:7%;bottom:18px;width:135px;height:28px;border-radius:50% 50% 12px 12px;background:#f7d071;box-shadow:0 8px 0 #dba94e}.island span{position:absolute;right:36px;bottom:10px;font-size:58px;transform:rotate(7deg);transform-origin:bottom}
    footer{min-height:43px;display:flex;justify-content:center;align-items:center;gap:9px;background:var(--sand);font-family:"Shrikhand",Georgia,serif;letter-spacing:.04em}footer b{color:var(--coral);font-size:1.2rem}
    .bon-voyage{width:min(640px,100%);margin:0 auto;padding:18px;border-radius:24px;background:#fff;box-shadow:0 12px 30px #23557818}.bon-voyage span{display:block;font-size:1.5rem}.bon-voyage strong{display:block;font-family:"Shrikhand",Georgia,serif;color:var(--coral);font-size:2.5rem}.bon-voyage p{margin:3px 0 0}
    @keyframes bob{0%,100%{transform:translateX(-58%) rotate(-1deg) translateY(0)}50%{transform:translateX(-58%) rotate(1deg) translateY(-7px)}}
    @keyframes waves{to{background-position-x:120px}}@keyframes drift{to{transform:translateX(24px)}}@keyframes puff{from{transform:translate(0,8px) scale(.6);opacity:.8}to{transform:translate(18px,-20px) scale(1.5);opacity:0}}
    @media(max-width:640px){.hero{padding-top:36px}.sun{width:62px;height:62px;top:28px;right:-10px}.cloud-one{top:100px;left:-55px}.cloud-two{display:none}.countdown{gap:7px}.time-card{border-radius:15px;padding:13px 4px 11px}.tip p{font-size:.75rem}.ship-wrap{left:48%;transform:translateX(-60%) scale(.84);transform-origin:bottom}.island{right:-35px;transform:scale(.8)}.ocean{height:205px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="page">
    <div class="sun" aria-hidden="true"></div><div class="cloud cloud-one" aria-hidden="true"></div><div class="cloud cloud-two" aria-hidden="true"></div>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow"><span aria-hidden="true">⚓</span> Adventure is on the horizon</p>
      <h1 id="page-title">Celcis Cruise mode:<br><em>almost on!</em></h1>
      <p class="date">NOVEMBER 6, 2026 <span>•</span> SET SAIL</p>
      <div class="countdown" id="countdown" role="timer" aria-live="polite" aria-label="Time until the cruise">
        <div class="time-card"><strong id="days">—</strong><span>Days</span></div>
        <div class="time-card"><strong id="hours">—</strong><span>Hours</span></div>
        <div class="time-card"><strong id="minutes">—</strong><span>Minutes</span></div>
        <div class="time-card"><strong id="seconds">—</strong><span>Seconds</span></div>
      </div>
      <div class="tip"><div class="tip-icon" aria-hidden="true">☀</div><div><span class="tip-label">Captain's tip</span><p id="tip-text">Pack the sunscreen — ocean days are brighter than they look!</p></div><button id="tip-button" type="button" aria-label="Show another cruise tip" title="Another tip">↻</button></div>
    </section>
    <section class="ocean" aria-label="Animated cruise ship sailing on the ocean">
      <div class="ship-wrap" aria-hidden="true"><div class="smoke smoke-one"></div><div class="smoke smoke-two"></div><div class="ship"><div class="flag"></div><div class="top"><i></i><i></i><i></i><i></i></div><div class="deck"><i></i><i></i><i></i><i></i><i></i></div><div class="hull"><span>LET'S SAIL</span></div></div></div>
      <div class="island" aria-hidden="true"><span>🌴</span></div><div class="wave wave-a"></div><div class="wave wave-b"></div>
    </section>
    <footer><span>Sea you soon</span><b aria-hidden="true">♡</b></footer>
  </main>
  <script>
    const cruiseDate = new Date('2026-11-06T00:00:00-04:00');
    const fields = ['days','hours','minutes','seconds'];
    function updateCountdown(){
      const distance = cruiseDate.getTime() - Date.now();
      if(distance <= 0){
        document.getElementById('countdown').outerHTML = '<div class="bon-voyage" role="status"><span>🎉 🚢 🎉</span><strong>Bon voyage!</strong><p>The wait is over. Time to make waves!</p></div>';
        clearInterval(countdownTimer); return;
      }
      const values = [Math.floor(distance/86400000),Math.floor(distance/3600000)%24,Math.floor(distance/60000)%60,Math.floor(distance/1000)%60];
      fields.forEach((field,index)=>document.getElementById(field).textContent = String(values[index]).padStart(index ? 2 : 1,'0'));
    }
    const tips=['Pack the sunscreen — ocean days are brighter than they look!','Keep your swimsuit in your carry-on for an early pool visit.','Download your cruise app before reaching the terminal.','Leave a little room in the suitcase for vacation treasures.'];
    let tipIndex=0;
    document.getElementById('tip-button').addEventListener('click',()=>{tipIndex=(tipIndex+1)%tips.length;document.getElementById('tip-text').textContent=tips[tipIndex]});
    const countdownTimer=setInterval(updateCountdown,1000);updateCountdown();
  </script>
</body>
</html>
